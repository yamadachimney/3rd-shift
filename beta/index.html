<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3RD シフト（テスト版）</title>
<meta name="description" content="3RD のシフト希望・シフト表">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="3RD シフト">
<meta property="og:description" content="シフトの希望を出す・決まったシフトを見る">
<meta property="og:url" content="https://yamadachimney.github.io/3RD-shift/">
<meta property="og:image" content="https://yamadachimney.github.io/3RD-shift/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1b1814">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3RD シフト">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 3RD シフト：主役は「日付 × スタッフ」の表。スマホで片手で見られるように、操作は下から出るシートで */
:root{
  --bg:#f4f2ee; --surface:#ffffff; --ink:#1b1814; --muted:#6b645a; --line:#ddd7cd; --line2:#eeeae3;
  --accent:#9a4f0e; --accent-ink:#ffffff; --on:#1f5f8f; --on-bg:#e3eef7;
  --ok:#23804f; --mb:#a8710a; --ng:#b33a3a; --bad:#c23b3b; --warn-bg:#fff4dc;
  --f-d:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --f-m:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --surface:#1c1a18; --ink:#f1ede6; --muted:#a8a095; --line:#34302b; --line2:#26231f;
    --accent:#f0a24a; --accent-ink:#1a1209; --on:#8cc3ef; --on-bg:#1d2e3c;
    --ok:#5cc58f; --mb:#e6b04f; --ng:#ff8a80; --bad:#ff8080; --warn-bg:#2c2414; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1c1a18; --ink:#f1ede6; --muted:#a8a095; --line:#34302b; --line2:#26231f;
  --accent:#f0a24a; --accent-ink:#1a1209; --on:#8cc3ef; --on-bg:#1d2e3c;
  --ok:#5cc58f; --mb:#e6b04f; --ng:#ff8a80; --bad:#ff8080; --warn-bg:#2c2414; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-d);font-size:14px;line-height:1.55;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:28px;font-weight:900;letter-spacing:.06em}
.brand span{color:var(--muted);font-size:13px;font-weight:700}
.menubtn{font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.menubtn span{font-size:17px;line-height:1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 10px;min-height:32px;font-size:12.5px}
.btn.big{min-height:48px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:2px;align-self:flex-start;max-width:100%}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.badge{font-size:11px;min-width:18px;height:18px;line-height:18px;border-radius:99px;background:var(--bad);color:#fff;padding:0 5px;text-align:center}

.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tight{padding:12px 14px;gap:8px}
.card.alert{border:1.5px solid var(--accent)}
.card h2{margin:0;font-size:15px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:13px}
h2.sec{margin:4px 0 0;font-size:16px;font-weight:900}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.warnt{color:var(--bad)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.empty-hint{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}
.banner{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1.5px solid var(--accent);background:var(--warn-bg);border-radius:10px;padding:10px 14px;text-align:left;width:100%}
.banner span{color:var(--accent);font-weight:700;font-size:13px}

.chip{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--line2);color:var(--muted);white-space:nowrap}
.chip.owner{background:var(--accent);color:var(--accent-ink)}
.chip.me{background:var(--on-bg);color:var(--on)}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.chip.no{background:var(--line2);color:var(--muted)}
.chip.now{background:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.notes{display:flex;flex-direction:column;gap:4px;font-size:13px;border-top:1px solid var(--line2);padding-top:8px}
.notes b{font-weight:700}

.pbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.psel{font-weight:700;font-size:15px}
.phase{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 10px;background:var(--line2);color:var(--muted);white-space:nowrap}
.phase.request{background:var(--warn-bg);color:var(--mb)}
.phase.making{background:var(--on-bg);color:var(--on)}
.phase.fixed{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.pmsg{font-size:12.5px;color:var(--muted)}

select,input[type=text],input[type=password],input[type=date],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:40px;max-width:100%}
input[type=text],input[type=password]{flex:1 1 160px;min-width:0}
.ta{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lb,.lbs{font-size:12px;font-weight:700;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two input{width:100%}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.err{color:var(--bad);font-size:13px;min-height:1.2em}

/* シフト表 */
.twrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto;max-height:76vh}
.st{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.st th,.st td{border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);padding:0;text-align:center}
.st thead th{position:sticky;top:0;z-index:3;background:var(--surface);padding:8px 4px;font-weight:700;border-bottom:1px solid var(--line);min-width:54px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px;font-size:12px}
.st thead th.me{color:var(--on)}
.st .dcol{position:sticky;left:0;z-index:2;background:var(--surface);border-left:0;min-width:46px;width:46px;padding:4px 4px;line-height:1.2}
.st thead .dcol{z-index:4}
.st .dcol b{display:block;font-family:var(--f-m);font-size:13px}
.st .dcol span{font-size:11px;color:var(--muted)}
.st .dcol.sat span{color:var(--on)} .st .dcol.sun span{color:var(--ng)}
.st tr.today .dcol{background:var(--warn-bg)}
.st tr.today td{background:color-mix(in srgb,var(--warn-bg) 60%,var(--surface))}
.st .ncol{min-width:32px;width:32px;font-family:var(--f-m);font-weight:500;color:var(--muted)}
.st .ncol.short{color:var(--bad);font-weight:700;background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:46px;padding:3px 2px;border:0;background:none;font-family:var(--f-m);line-height:1.15}
button.cbtn:hover{background:var(--line2)}
.cell.me{background:color-mix(in srgb,var(--on-bg) 45%,var(--surface))}
.wm{font-size:10px;letter-spacing:-.02em;color:var(--muted);white-space:nowrap}
.wm.ok{color:var(--ok)} .wm.mb{color:var(--mb)} .wm.ng{color:var(--ng)} .wm.na{opacity:.5}
.as{display:inline-block;background:var(--on);color:var(--surface);border-radius:5px;padding:2px 4px;font-size:11.5px;font-weight:500;white-space:nowrap}
.cell.warn .as{background:var(--bad)}

/* 今日・自分のシフト */
.tlist,.mylist{display:flex;flex-direction:column;gap:2px}
.trow,.myrow{display:flex;gap:12px;align-items:center;padding:7px 2px;border-top:1px solid var(--line2)}
.trow:first-child,.myrow:first-child{border-top:0}
.trow b,.myrow b{min-width:5.5em;font-weight:700}
.trow.me b{color:var(--on)}
.tm{font-family:var(--f-m);font-size:13px}
.tm.ok{color:var(--ok)} .tm.mb{color:var(--mb)} .tm.ng{color:var(--ng)} .tm.na{color:var(--muted)}
.myrow.past{opacity:.45}
.myrow.today b{color:var(--accent)}

/* 希望フォーム */
.wlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.wrow{display:grid;grid-template-columns:3.4em auto minmax(0,1fr);gap:8px 10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line2)}
.wrow:first-child{border-top:0}
.wrow.ng{background:color-mix(in srgb,var(--ng) 5%,var(--surface))}
.wd{line-height:1.15}.wd b{display:block;font-family:var(--f-m);font-size:14px}.wd span{font-size:11.5px;color:var(--muted)}
.wd.sat span{color:var(--on)}.wd.sun span{color:var(--ng)}
.seg{display:inline-flex;justify-self:start;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);min-width:40px;min-height:38px;font-weight:900;font-size:16px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg .k-ok[aria-pressed="true"]{background:var(--ok);color:#fff}
.seg .k-mb[aria-pressed="true"]{background:var(--mb);color:#fff}
.seg .k-ng[aria-pressed="true"]{background:var(--ng);color:#fff}
.wtime{display:flex;align-items:center;gap:4px;min-width:0}
.wtime.na{font-size:12px;color:var(--muted)}
.tsel{min-height:36px;padding:4px 6px;font-family:var(--f-m);font-size:13px;min-width:0}
@media (max-width:420px){.wrow{grid-template-columns:3.2em auto}.wrow .wtime{grid-column:2/-1}.wrow .wtime.na{display:none}}
.submit{display:flex;flex-direction:column;gap:6px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:6px}
.wishbox{border-radius:10px;padding:10px 12px;background:var(--line2);display:flex;flex-direction:column;gap:2px}
.wishbox b{font-size:16px}
.wishbox.ok b{color:var(--ok)} .wishbox.mb b{color:var(--mb)} .wishbox.ng b{color:var(--ng)}

/* リスト */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li.sup{grid-template-columns:auto minmax(0,1fr) auto}
.li.off{opacity:.55}
.li .nm{font-weight:700;overflow-wrap:anywhere}
.li .meta{font-size:12px;color:var(--muted)}
.li .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.snote{font-size:13px;overflow-wrap:anywhere}
@media (max-width:560px){.li,.li.sup{grid-template-columns:minmax(0,1fr)}.li.sup .chip{justify-self:start}.li .acts{justify-content:flex-start}}
.chip.sup-new{background:var(--warn-bg);color:var(--mb)}
.chip.sup-seen{background:var(--on-bg);color:var(--on)}
.chip.sup-ordered{background:color-mix(in srgb,var(--accent) 15%,var(--surface));color:var(--accent)}
.chip.sup-done{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.li.sup.done{opacity:.6}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.namebtn{min-height:52px;font-size:16px;font-weight:700}

/* メニュー・シート */
.menu{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.mitem b{font-size:16px}.mitem span{font-size:12.5px;color:var(--muted)}
.mitem.on{border:2px solid var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;background:var(--surface);border-radius:16px 16px 0 0;padding:16px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-size:18px;font-weight:900}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
@media (max-width:480px){.brand h1{font-size:24px}.menubtn{padding:6px 10px;font-size:13px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div id="toastBox"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
(function(){
'use strict';
/* ---------- 3RD シフト：共通 ----------
   時間は「営業日の0時からの分」。日をまたぐと1440以上（例：翌2:00＝1560）。
   ラスト（終わり未定）は LAST。営業日は朝6時で切り替える */
const LAST=9999, DAYCUT=6;
const DOW=['日','月','火','水','木','金','土'];
const PHASES={closed:'準備中',request:'希望募集中',making:'組み中',fixed:'確定'};
const WK={ok:'○',mb:'△',ng:'×'};
const WKL={ok:'入れる',mb:'入れなくはない',ng:'入れない'};
const S={uid:'',isAdmin:false,sid:'',join:null,staff:{},periods:{},pid:'',wishes:{},shifts:{},joins:{},members:{},sup:{},
  tab:'shift',mode:'shift',loading:true,fail:'',arm:'',showDone:false,draft:null,showPast:false};

function h(tag,attrs,kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='style')el.style.cssText=v;
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  (kids||[]).forEach(c=>{if(c==null||c===false)return;el.append(c.nodeType?c:document.createTextNode(c));});
  return el;
}
const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dowOf(iso){return new Date(iso+'T00:00:00Z').getUTCDay()}
function md(iso){const p=iso.split('-');return (+p[1])+'/'+(+p[2])}
function dl(iso){return md(iso)+'('+DOW[dowOf(iso)]+')'}
function bizToday(){return isoOf(new Date(Date.now()-DAYCUT*3600e3))}
function nowMin(){const d=new Date();let m=d.getHours()*60+d.getMinutes();if(d.getHours()<DAYCUT)m+=1440;return m}
function lastDay(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}  // m: 1-12
function datesOf(p){const a=[];if(!p||!p.start||!p.end)return a;let d=p.start;while(d<=p.end&&a.length<62){a.push(d);d=addDays(d,1)}return a}
function fmt(m){if(m===LAST)return 'ラスト';const hh=Math.floor(m/60),mm=m%60;return (hh>=24?'翌'+(hh-24):hh)+':'+pad(mm)}
function sh(m){if(m===LAST)return 'L';const hh=Math.floor(m/60)%24,mm=m%60;return hh+(mm?':'+pad(mm):'')}
function rng(s,e){return fmt(s)+'〜'+fmt(e)}
function srng(s,e){return sh(s)+'〜'+sh(e)}
function parseHM(v){const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');if(!m)return null;return (+m[1])*60+(+m[2])}
function toast(t){
  const b=$('toastBox');b.replaceChildren(h('div',{class:'toast',role:'status',text:t}));
  clearTimeout(toast.t);toast.t=setTimeout(()=>b.replaceChildren(),2600);
}
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* 時間の選択肢（17:00〜翌6:00、30分刻み） */
function timeOpts(isEnd){const a=[];for(let m=17*60;m<=30*60;m+=30){if(!isEnd&&m===30*60)break;a.push(m)}if(isEnd)a.push(LAST);return a}
function timeSel(val,isEnd){
  const s=h('select',{class:'tsel','aria-label':isEnd?'終わり':'はじまり'},timeOpts(isEnd).map(m=>h('option',{value:String(m),text:fmt(m)})));
  s.value=String(val);if(s.value!==String(val))s.value=String(isEnd?LAST:22*60);
  return s;
}

/* ---------- データの見方 ---------- */
function staffList(all){return Object.keys(S.staff||{}).map(id=>Object.assign({id:id},S.staff[id])).filter(x=>all||!x.off).sort((a,b)=>(a.ord||0)-(b.ord||0)||String(a.name).localeCompare(String(b.name)))}
function nameOf(sid){return (S.staff[sid]&&S.staff[sid].name)||'（削除済み）'}
function per(){return S.periods[S.pid]||null}
function phaseOf(pid){const p=S.periods[pid];return (p&&p.phase)||'closed'}
function periodList(){return Object.keys(S.periods||{}).map(id=>Object.assign({id:id},S.periods[id])).sort((a,b)=>a.start<b.start?1:-1)}
function plabel(p){if(!p)return '';return p.name||(md(p.start)+'〜'+md(p.end))}
function openOf(p){return (p&&typeof p.open==='number')?p.open:22*60}
function needOf(p){return (p&&typeof p.need==='number')?p.need:2}
function wishOf(sid){return S.wishes[sid]||null}
function wishDay(sid,d){const w=wishOf(sid);return (w&&w.days&&w.days[d])||null}
function shiftsOn(d){const o=S.shifts[d]||{};return Object.keys(o).filter(sid=>o[sid]).map(sid=>Object.assign({sid:sid},o[sid])).sort((a,b)=>a.s-b.s||((S.staff[a.sid]||{}).ord||0)-((S.staff[b.sid]||{}).ord||0))}
function wishText(w){if(!w)return '未回答';if(w.k==='ng')return '× 入れない';return WK[w.k]+' '+rng(w.s,w.e)}
/* 表示する期間を選ぶ：今日を含む確定 → 募集中 → これから → いちばん新しい */
function pickPid(){
  const all=periodList().filter(p=>S.isAdmin||p.phase!=='closed');
  if(S.pid&&all.some(p=>p.id===S.pid))return;
  const saved=lsGet('rd-pid');if(saved&&all.some(p=>p.id===saved)){S.pid=saved;return}
  const t=bizToday();
  const f=all.find(p=>p.phase==='fixed'&&p.start<=t&&t<=p.end)||all.slice().reverse().find(p=>p.phase==='request')
    ||all.slice().reverse().find(p=>p.start>t)||all[0];
  S.pid=f?f.id:'';
}
function setPid(id){S.pid=id;lsSet('rd-pid',id);S.draft=null;S.wishes={};S.shifts={};resub();render()}

/* ---------- データ（Firebase Realtime Database） ----------
   ・スタッフはスマホごとの匿名ログイン。最初に名前を選ぶと joins/<uid> に申請が入り、
     オーナーが承認すると members/<uid> = スタッフID になる（以後そのスマホはその人）
   ・オーナーは共通のオーナーアカウント（暗証番号＝そのパスワード）。権限は Firebase のルールで確認 */
const FBX={db:null,auth:null,adminAuth:null,adminDb:null};
const ADMIN_EMAIL=(window.FB_ADMIN_EMAIL||'owner@rd-shift.example');
const SUBS={};
function fbReady(){return !!FBX.db}
function fbInit(){
  if(!window.firebase||!window.FB_CONFIG||!window.FB_CONFIG.apiKey){S.fail='設定（firebase-config.js）が読み込めませんでした';return false}
  firebase.initializeApp(window.FB_CONFIG);
  FBX.db=firebase.database();FBX.auth=firebase.auth();
  const a2=firebase.initializeApp(window.FB_CONFIG,'admin');
  FBX.adminAuth=a2.auth();FBX.adminDb=a2.database();
  return true;
}
function DB(){return S.isAdmin?FBX.adminDb:FBX.db}
function newKey(p){return DB().ref(p).push().key}

/* いま必要なデータだけを受け取る（画面や立場が変わるたびに付け外し） */
function want(){
  const w={};
  w.staff=['staff',v=>{S.staff=v||{}}];
  if(S.isAdmin){
    w.joins=['joins',v=>{S.joins=v||{}}];
    w.members=['members',v=>{S.members=v||{}}];
  }else if(S.uid){
    w.me=['members/'+S.uid,v=>{S.sid=v||''}];
    w.myjoin=['joins/'+S.uid,v=>{S.join=v||null}];
  }
  if(S.isAdmin||S.sid){
    w.periods=['periods',v=>{S.periods=v||{};pickPid()}];
    if(S.pid&&S.periods[S.pid]){
      if(S.isAdmin)w.wishes=['wishes/'+S.pid,v=>{S.wishes=v||{}}];
      else w.wishes=['wishes/'+S.pid+'/'+S.sid,v=>{S.wishes=v?{[S.sid]:v}:{}}];
      if(S.isAdmin||phaseOf(S.pid)==='fixed')w.shifts=['shifts/'+S.pid,v=>{S.shifts=v||{}}];
    }
    if(S.mode==='supply')w.sup=['supplies',v=>{S.sup=v||{}}];
  }
  return w;
}
function resub(){
  if(!fbReady())return;
  const w=want();
  for(const k of Object.keys(SUBS)){
    if(!w[k]||w[k][0]!==SUBS[k].path||SUBS[k].db!==DB()){SUBS[k].ref.off();delete SUBS[k];clearOf(k)}
  }
  for(const k of Object.keys(w)){
    if(SUBS[k])continue;
    const path=w[k][0],fn=w[k][1],db=DB(),ref=db.ref(path);
    const sub={path:path,ref:ref,db:db,got:false};SUBS[k]=sub;
    ref.on('value',snap=>{
      if(SUBS[k]!==sub)return;
      sub.got=true;fn(snap.val());S.fail='';
      resub();S.loading=!Object.values(SUBS).every(x=>x.got);render();
    },err=>{
      if(SUBS[k]!==sub)return;
      delete SUBS[k];clearOf(k);
      // 確定前のシフトなど、見られなくなったものは静かに外す
      resub();S.loading=!Object.values(SUBS).every(x=>x.got);render();
    });
  }
  S.loading=!Object.values(SUBS).every(x=>x.got);
}
function clearOf(k){
  if(k==='shifts')S.shifts={};else if(k==='wishes')S.wishes={};else if(k==='sup')S.sup={};
  else if(k==='periods')S.periods={};else if(k==='joins')S.joins={};else if(k==='members')S.members={};
}
function resetSubs(){for(const k of Object.keys(SUBS)){SUBS[k].ref.off();delete SUBS[k]}S.loading=true;resub();render()}

async function put(up,msg){
  try{await DB().ref().update(up);if(msg)toast(msg);return true}
  catch(e){
    const c=String(e&&(e.code||e.message)||e);
    toast(/PERMISSION/i.test(c)?'保存できませんでした（権限がないか、受付が締め切られています）':'保存できませんでした。電波を確認してください');
    return false;
  }
}

async function adminLogin(pin){
  try{await FBX.adminAuth.signInWithEmailAndPassword(ADMIN_EMAIL,String(pin));return ''}
  catch(e){
    const c=String(e&&(e.code||e.message)||'');
    return /too-many/i.test(c)?'何度も間違えたので、少し時間をおいてください'
      :/network/i.test(c)?'通信がうまくいきませんでした。もう一度押してください':'暗証番号が違います';
  }
}
async function adminLogout(){try{await FBX.adminAuth.signOut()}catch(e){}}

/* 画面を閉じて60秒たったら接続を切る（同時接続数の節約） */
let offT=null;
document.addEventListener('visibilitychange',()=>{
  if(!fbReady())return;
  if(document.hidden){offT=setTimeout(()=>{FBX.db.goOffline();FBX.adminDb.goOffline()},60000)}
  else{clearTimeout(offT);FBX.db.goOnline();FBX.adminDb.goOnline()}
});
function devName(){const u=navigator.userAgent||'';
  const os=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'その他';
  const br=/Line\//.test(u)?'LINE':/CriOS|Chrome/.test(u)?'Chrome':/Safari/.test(u)?'Safari':/Firefox/.test(u)?'Firefox':'';
  return (os+' '+br).trim()}

  const go=h('button',{class:'btn primary',text:'この名前で申請する',onclick:async()=>{

/* ---------- 期間の切り替え ---------- */
function periodBar(){
  const p=per();
  const list=periodList().filter(x=>S.isAdmin||x.phase!=='closed');
  if(!p)return null;
  const sel=h('select',{class:'psel','aria-label':'期間',onchange:e=>setPid(e.target.value)},
    list.map(x=>h('option',{value:x.id,text:plabel(x)+'（'+PHASES[x.phase||'closed']+'）'})));
  sel.value=S.pid;
  const ph=p.phase||'closed';
  let msg='';
  if(ph==='request')msg=p.deadline?'希望の締め切り '+dl(p.deadline):'希望を受付中';
  else if(ph==='fixed')msg='シフトが決まりました';
  else if(ph==='making')msg='受付終了。オーナーが組んでいます';
  else msg=S.isAdmin?'スタッフにはまだ見えていません':'';
  return h('div',{class:'pbar'},[sel,h('span',{class:'phase '+ph,text:PHASES[ph]}),msg?h('span',{class:'pmsg',text:msg}):null]);
}

/* ---------- シフト表（日付 × スタッフ） ---------- */
function shiftTable(owner){
  const p=per(),days=datesOf(p),st=staffList(),need=needOf(p),t=bizToday();
  // 期間中にシフトか希望がある、もう表示しない人も列に出す
  Object.keys(S.staff).forEach(id=>{if(S.staff[id].off&&!st.some(x=>x.id===id)&&(days.some(d=>S.shifts[d]&&S.shifts[d][id])||(owner&&S.wishes[id])))st.push(Object.assign({id:id},S.staff[id]))});
  const head=h('tr',{},[h('th',{class:'dcol',text:''})].concat(st.map(x=>h('th',{class:x.id===S.sid?'me':'',text:x.name})),[h('th',{class:'ncol',text:'人数'})]));
  const rows=days.map(d=>{
    const dw=dowOf(d),n=shiftsOn(d).length;
    const cls=['dcol',dw===0?'sun':dw===6?'sat':'',d===t?'today':''].join(' ');
    const tds=[h('th',{class:cls},[h('b',{text:md(d)}),h('span',{text:DOW[dw]})])];
    st.forEach(x=>{
      const a=S.shifts[d]&&S.shifts[d][x.id],w=owner?wishDay(x.id,d):null;
      const kids=[];
      if(owner)kids.push(h('span',{class:'wm '+(w?w.k:'na'),text:w?(w.k==='ng'?'×':WK[w.k]+srng(w.s,w.e)):'–'}));
      if(a)kids.push(h('span',{class:'as',text:srng(a.s,a.e)}));
      const c=['cell',a?'on':'',x.id===S.sid?'me':'',owner&&w&&w.k==='ng'&&a?'warn':''].join(' ');
      tds.push(h('td',{class:c},[owner?h('button',{class:'cbtn',onclick:()=>openCell(d,x.id),'aria-label':dl(d)+' '+x.name},kids):h('div',{class:'cbtn'},kids)]));
    });
    tds.push(h('td',{class:'ncol'+(n<need?' short':''),text:String(n)}));
    return h('tr',{class:d===t?'today':''},tds);
  });
  return h('div',{class:'twrap'},[h('table',{class:'st'},[h('thead',{},[head]),h('tbody',{},rows)])]);
}

/* ---------- 今日の出勤 ---------- */
function todayCard(){
  const p=per(),t=bizToday();
  if(!p||!(p.start<=t&&t<=p.end))return null;
  if(!S.isAdmin&&p.phase!=='fixed')return null;
  const list=shiftsOn(t),nm=nowMin();
  return h('div',{class:'card today'},[h('h2',{text:'今日 '+dl(t)+' の出勤'}),
    list.length?h('div',{class:'tlist'},list.map(x=>{
      const now=nm>=x.s&&(x.e===LAST||nm<x.e)&&nm>=openOf(p)-120;
      return h('div',{class:'trow'+(x.sid===S.sid?' me':'')},[h('b',{text:nameOf(x.sid)}),h('span',{class:'tm',text:rng(x.s,x.e)}),now?h('span',{class:'chip now',text:'いま'}):null]);
    })):h('p',{text:'今日はシフトが入っていません'})]);
}

/* ---------- 自分のシフト ---------- */
function myList(){
  const p=per();if(!p||!S.sid||p.phase!=='fixed')return null;
  const mine=datesOf(p).filter(d=>S.shifts[d]&&S.shifts[d][S.sid]).map(d=>Object.assign({d:d},S.shifts[d][S.sid]));
  const t=bizToday();
  return h('div',{class:'card'},[h('div',{class:'mhead'},[h('h2',{text:'自分のシフト（'+mine.length+'日）'}),
      mine.length?h('button',{class:'btn sm',onclick:()=>downloadIcs(mine),text:'カレンダーに入れる'}):null]),
    mine.length?h('div',{class:'mylist'},mine.map(x=>h('div',{class:'myrow'+(x.d<t?' past':x.d===t?' today':'')},[h('b',{text:dl(x.d)}),h('span',{class:'tm',text:rng(x.s,x.e)})])))
      :h('p',{text:'この期間はシフトが入っていません'})]);
}
function downloadIcs(list){
  const z=n=>String(n).padStart(2,'0');
  const at=(d,m)=>{const x=new Date(new Date(d+'T00:00:00+09:00').getTime()+m*60000);return x.getUTCFullYear()+z(x.getUTCMonth()+1)+z(x.getUTCDate())+'T'+z(x.getUTCHours())+z(x.getUTCMinutes())+'00Z'};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//3RD//shift//JA','CALSCALE:GREGORIAN'];
  list.forEach(x=>{
    const e=x.e===LAST?29*60:x.e;
    L.push('BEGIN:VEVENT','UID:3rd-'+x.d+'-'+S.sid+'@rd-shift','DTSTAMP:'+at(bizToday(),0),'DTSTART:'+at(x.d,x.s),'DTEND:'+at(x.d,e),
      'SUMMARY:3RD シフト','DESCRIPTION:'+rng(x.s,x.e)+(x.e===LAST?'（終わりはラスト。カレンダー上は5:00にしています）':''),
      'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:3RD シフト','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const b=new Blob([L.join('\r\n')],{type:'text/calendar'});
  const a=h('a',{href:URL.createObjectURL(b),download:'3rd-shift.ics'});document.body.append(a);a.click();a.remove();
  toast('カレンダー用のファイルを作りました。開くと追加できます');
}

  const p=per(),kids=[];
  if(!p){kids.push(h('div',{class:'empty-hint',text:S.isAdmin?'まだ期間がありません。「設定」から作ってください':'まだシフトの期間がありません。オーナーが作るまで待ってね'}));return h('div',{class:'col'},kids)}

  if(p.phase==='fixed'||S.isAdmin){
    if(S.isAdmin&&p.phase!=='fixed')kids.push(h('p',{class:'note',text:'まだ確定していないので、スタッフにはこの表は見えていません。'}));
    const ml=myList();if(ml)kids.push(ml);
    kids.push(h('h2',{class:'sec',text:'みんなのシフト'}));
    kids.push(shiftTable(false));
    kids.push(h('div',{class:'row'},[h('button',{class:'btn sm',onclick:copyLine,text:'LINE用にコピー'})]));
  }else{
    const w=wishOf(S.sid);
    kids.push(h('div',{class:'card'},[h('h2',{text:p.phase==='request'?'いまは希望を受付中です':'まだシフトは決まっていません'}),
      h('p',{text:p.phase==='request'?(w?'希望は出してあります（'+fmtAt(w.at)+'）。締め切りまでなら直せます。':'まだ希望を出していません。'):'オーナーが組んで確定すると、ここに出ます。'}),
      p.phase==='request'?h('div',{class:'row'},[h('button',{class:'btn primary',onclick:()=>{S.tab='wish';render()},text:w?'希望を見る・直す':'希望を出す'})]):null]));
  }
  return h('div',{class:'col'},kids);
}
function fmtAt(ts){if(!ts)return '';const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+pad(d.getMinutes())}
function lineText(){
  const p=per(),L=['【3RD シフト】'+plabel(p)];
  datesOf(p).forEach(d=>{const a=shiftsOn(d);L.push(dl(d)+'　'+(a.length?a.map(x=>nameOf(x.sid)+' '+srng(x.s,x.e)).join('／'):'—'))});
  return L.join('\n');
}
function copyLine(){
  const t=lineText();
  const done=()=>toast('コピーしました。LINEに貼り付けできます');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>showText(t));else showText(t);
}
function showText(t){layer(h('div',{class:'sheet'},[h('h3',{text:'コピーしてね'}),h('textarea',{class:'ta',rows:'12',text:t}),h('button',{class:'btn',onclick:closeSheet,text:'閉じる'})]))}

/* ---------- 希望を出す ---------- */
function wishView(){
  const p=per(),kids=[];
  if(!p){kids.push(h('div',{class:'empty-hint',text:'まだシフトの期間がありません'}));return h('div',{class:'col'},kids)}
  kids.push(periodBar());
  const saved=wishOf(S.sid);
  if(p.phase!=='request'){
    kids.push(h('div',{class:'card'},[h('h2',{text:p.phase==='fixed'?'この期間は確定しました':p.phase==='making'?'希望の受付は締め切りました':'まだ希望の受付前です'}),
      h('p',{text:p.phase==='closed'?'オーナーが受付を始めると、ここから出せるようになります。':'変えたいときはオーナーに直接連絡してください。'})]));
    if(saved)kids.push(wishSummary(saved,p));
    return h('div',{class:'col'},kids);
  }
  if(!S.draft||S.draft.pid!==S.pid){
    S.draft={pid:S.pid,days:JSON.parse(JSON.stringify((saved&&saved.days)||{})),note:(saved&&saved.note)||''};
  }

    h('div',{class:'row'},[h('span',{class:'lbs',text:'まとめて：'}),
      h('button',{class:'btn sm',onclick:()=>fillRest('ok'),text:'残りを全部○'}),
      h('button',{class:'btn sm',onclick:()=>fillRest('ng'),text:'残りを全部×'}),
      h('button',{class:'btn sm',onclick:()=>{D.days={};render()},text:'全部消す'})])]));
  const list=h('div',{class:'wlist'},days.map(d=>{
    const v=D.days[d],dw=dowOf(d);
    const seg=h('div',{class:'seg ks'},['ok','mb','ng'].map(k=>h('button',{type:'button','aria-pressed':v&&v.k===k?'true':'false',class:'k-'+k,
      onclick:()=>{if(v&&v.k===k)delete D.days[d];else D.days[d]=k==='ng'?{k:'ng'}:{k:k,s:(v&&v.s!=null)?v.s:def.s,e:(v&&v.e!=null)?v.e:def.e};render()},text:WK[k]})));
    let tm=null;
    if(v&&v.k!=='ng'){
      const s=timeSel(v.s,false),e=timeSel(v.e,true);

      e.onchange=()=>{v.e=+e.value;if(v.e!==LAST&&v.e<=v.s){toast('終わりははじまりより後にしてね');v.e=LAST;e.value=String(LAST)}};
      tm=h('div',{class:'wtime'},[s,h('span',{text:'〜'}),e]);
    }
    return h('div',{class:'wrow'+(v?' '+v.k:'')},[h('div',{class:'wd '+(dw===0?'sun':dw===6?'sat':'')},[h('b',{text:md(d)}),h('span',{text:DOW[dw]})]),seg,tm||h('div',{class:'wtime na',text:v?'':'未回答'})]);
  }));
  kids.push(list);
  const note=h('textarea',{class:'ta',rows:'3',maxlength:'300',placeholder:'例：週2くらいがいい／テスト期間は少なめで',oninput:e=>{D.note=e.target.value}});note.value=D.note;
  kids.push(h('div',{class:'field'},[h('label',{text:'オーナーへのひとこと（任意）'}),note]));
  const nNa=days.filter(d=>!D.days[d]).length;
  const go=h('button',{class:'btn primary big',text:saved?'出し直す':'希望を出す',onclick:async()=>{

    h('p',{class:'note',text:'足りないもの・壊れたものを書いておくと、オーナーが確認して注文します。同じものがもう出ていないか先に見てね。'})];
  if(!vis.length)kids.push(h('div',{class:'empty-hint',text:'いまはリクエストがありません'}));
  else kids.push(h('div',{class:'list'},vis.map(x=>{
    const mine=x.uid===S.uid,acts=[];
    if(S.isAdmin&&SUPNEXT[x.status])acts.push(h('button',{class:'btn sm primary',onclick:()=>{const up={};up['supplies/'+x.id+'/status']=SUPNEXT[x.status];put(up)},text:'→ '+SUPST[SUPNEXT[x.status]]}));
    if(S.isAdmin&&x.status!=='new')acts.push(h('button',{class:'btn sm',onclick:()=>{const back={seen:'new',ordered:'seen',done:'ordered'}[x.status];const up={};up['supplies/'+x.id+'/status']=back;put(up)},'aria-label':'ひとつ戻す',text:'↩'}));
    if(S.isAdmin||(mine&&x.status==='new')){const a=S.arm==='sup'+x.id;acts.push(h('button',{class:'btn sm danger',onclick:()=>{if(!a){S.arm='sup'+x.id;render();return}S.arm='';const up={};up['supplies/'+x.id]=null;put(up,'消しました')},text:a?'消す？':'消す'}))}
    return h('div',{class:'li sup '+x.status},[h('span',{class:'chip sup-'+x.status,text:SUPST[x.status]||''}),
      h('div',{style:'min-width:0'},[h('div',{class:'nm',text:x.item||''}),x.note?h('div',{class:'snote',text:x.note}):null,
        h('div',{class:'meta',text:[x.who,x.createdAt?new Date(x.createdAt).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):''].filter(Boolean).join('　')+(mine?'　（自分）':'')})]),
      h('div',{class:'acts'},acts)]);
  })));
  if(nDone)kids.push(h('div',{class:'row'},[h('button',{class:'btn sm',onclick:()=>{S.showDone=!S.showDone;render()},text:S.showDone?'届いたものを隠す':'届いたものも見る（'+nDone+'）'}),
    S.isAdmin?h('button',{class:'btn sm danger',onclick:()=>{if(S.arm!=='supclr'){S.arm='supclr';render();return}S.arm='';const up={};arr.filter(x=>x.status==='done').forEach(x=>{up['supplies/'+x.id]=null});put(up,'片付けました')},text:S.arm==='supclr'?'もう一度押すと消す':'届いたものを片付ける'}):null]));
  return h('div',{class:'col'},kids);
}
function openSupForm(){
  const item=h('input',{type:'text',maxlength:'60',placeholder:'例：ライム、コースター'});
  const note=h('textarea',{class:'ta',rows:'3',maxlength:'300',placeholder:'理由・詳しく（例：あと2個しかない）'});
  const err=h('div',{class:'err',role:'alert'});
  const who=S.isAdmin?'オーナー':nameOf(S.sid);
  const go=h('button',{class:'btn primary',text:'リクエストする',onclick:async()=>{
    if(!item.value.trim()){err.textContent='何がほしいか書いてください';item.focus();return}
    const id=newKey('supplies'),up={};
    up['supplies/'+id]={uid:S.isAdmin?FBX.adminAuth.currentUser.uid:S.uid,item:item.value.trim(),note:note.value.trim(),who:who,status:'new',createdAt:firebase.database.ServerValue.TIMESTAMP};
    go.disabled=true;if(await put(up,'リクエストしました'))closeSheet();else go.disabled=false;
  }});
  layer(h('div',{class:'sheet',role:'dialog','aria-modal':'true'},[h('h3',{text:'備品リクエスト'}),
    h('div',{class:'field'},[h('label',{text:'ほしいもの・壊れたもの'}),item]),
    h('div',{class:'field'},[h('label',{text:'詳しく'}),note]),
    h('p',{class:'note',text:'名前は「'+who+'」で出ます。'}),err,
    h('div',{class:'row',style:'justify-content:flex-end'},[h('button',{class:'btn',onclick:closeSheet,text:'キャンセル'}),go])]));
  item.focus();
}

/* ---------- 描画 ---------- */
function tabs(list){
  return h('div',{class:'tabs',role:'tablist'},list.map(t=>h('button',{role:'tab','aria-selected':S.tab===t[0]?'true':'false',onclick:()=>{S.tab=t[0];S.arm='';render();window.scrollTo(0,0)}},[t[1],t[2]?h('span',{class:'badge',text:String(t[2])}):null])));
}
function render(){
  const top=h('header',{class:'top'},[h('div',{class:'brand'},[h('h1',{text:'3RD'}),h('span',{text:'シフト'})]),
    h('div',{class:'row'},[S.isAdmin?h('span',{class:'chip owner',text:'オーナー'}):(S.sid?h('span',{class:'chip me',text:nameOf(S.sid)}):null),
      h('button',{class:'btn menubtn',onclick:openMenu,'aria-label':'メニュー'},[h('span',{text:'☰'}),'メニュー'])])]);
  const body=[];
  if(S.fail)body.push(h('div',{class:'card alert'},[h('h2',{text:'うまく開けませんでした'}),h('p',{text:S.fail})]));
  else if(!S.uid||(S.loading&&!S.isAdmin&&!S.sid&&!Object.keys(S.staff).length))body.push(h('div',{class:'empty-hint',text:'読み込み中…'}));
  else if(!S.isAdmin&&!S.sid)body.push(joinView());
  else if(S.mode==='supply')body.push(supplyView());
  else if(S.isAdmin){
    if(['build','shift','set'].indexOf(S.tab)<0)S.tab='build';
    const nj=Object.keys(S.joins||{}).filter(u=>S.staff[S.joins[u].sid]).length;
    body.push(tabs([['build','組む'],['shift','スタッフの見え方'],['set','設定',nj]]));
    if(nj&&S.tab!=='set')body.push(h('button',{class:'banner',onclick:()=>{S.tab='set';render()}},[h('b',{text:'承認待ちが'+nj+'人います'}),h('span',{text:'設定で承認 →'})]));
    body.push(S.tab==='build'?buildView():S.tab==='set'?setView():shiftView());
  }else{
    if(['shift','wish'].indexOf(S.tab)<0)S.tab='shift';
    const p=per(),needWish=p&&p.phase==='request'&&!wishOf(S.sid);
    body.push(tabs([['shift','シフト'],['wish','希望を出す',needWish?'未':0]]));
    body.push(S.tab==='wish'?wishView():shiftView());
  }
  $('app').replaceChildren(top,h('main',{class:'col'},body));
}

/* ---------- 起動 ---------- */
function boot(){
  S.mode=lsGet('rd-mode')==='supply'?'supply':'shift';
  if(!fbInit()){render();return}
  render();
  let adminKnown=false;
  FBX.adminAuth.onAuthStateChanged(u=>{
    const a=!!u&&u.email===ADMIN_EMAIL;
    if(a!==S.isAdmin||!adminKnown){adminKnown=true;S.isAdmin=a;S.periods={};S.wishes={};S.shifts={};S.draft=null;
      if(a)S.tab='build';else if(S.tab==='build'||S.tab==='set')S.tab='shift';
      resetSubs()}
  });
  FBX.auth.onAuthStateChanged(async u=>{
    if(u){if(S.uid!==u.uid){S.uid=u.uid;resetSubs()}return}
    try{await FBX.auth.signInAnonymously()}catch(e){S.fail='ログインできませんでした。電波を確認して開き直してください';render()}
  });
}
window.addEventListener('DOMContentLoaded',boot);
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{Promise.reject().catch(()=>{})})}
</script>
</body>
